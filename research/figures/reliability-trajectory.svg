<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Reliability across long-horizon JutulDarcy benchmark milestones</title>
  <desc id="desc">Grouped bars show winner selection, numerical reporting, and grounded row evidence rates for four three-trial conditions.</desc>
  <rect width="1000" height="650" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Long-horizon JutulDarcy reliability (n=3 per condition)</text>
  <text x="500" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#536179">Percentage of trials passing each recorded criterion</text>

  <line x1="85" y1="500" x2="955" y2="500" stroke="#24324a" stroke-width="2"/>
  <line x1="85" y1="410" x2="955" y2="410" stroke="#d8dee9" stroke-width="1"/>
  <line x1="85" y1="320" x2="955" y2="320" stroke="#b9c2d0" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="85" y1="230" x2="955" y2="230" stroke="#d8dee9" stroke-width="1"/>
  <line x1="85" y1="140" x2="955" y2="140" stroke="#d8dee9" stroke-width="1"/>
  <text x="72" y="505" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#536179">0%</text>
  <text x="72" y="415" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#536179">25%</text>
  <text x="72" y="325" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#536179">50%</text>
  <text x="72" y="235" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#536179">75%</text>
  <text x="72" y="145" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#536179">100%</text>

  <!-- scientific-state compaction: 100, 33, 33 -->
  <rect x="125" y="140" width="42" height="360" rx="4" fill="#276FBF"/>
  <rect x="173" y="381.2" width="42" height="118.8" rx="4" fill="#F28E2B"/>
  <rect x="221" y="381.2" width="42" height="118.8" rx="4" fill="#2A9D8F"/>
  <text x="146" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172033">100</text>
  <text x="194" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172033">33</text>
  <text x="242" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172033">33</text>

  <!-- structured ledger: 100, 0, 100 -->
  <rect x="345" y="140" width="42" height="360" rx="4" fill="#276FBF"/>
  <rect x="393" y="496" width="42" height="4" rx="2" fill="#F28E2B"/>
  <rect x="441" y="140" width="42" height="360" rx="4" fill="#2A9D8F"/>
  <text x="366" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172033">100</text>
  <text x="414" y="487" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172033">0</text>
  <text x="462" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172033">100</text>

  <!-- targeted retrieval: 100, 100, 100 -->
  <rect x="565" y="140" width="42" height="360" rx="4" fill="#276FBF"/>
  <rect x="613" y="140" width="42" height="360" rx="4" fill="#F28E2B"/>
  <rect x="661" y="140" width="42" height="360" rx="4" fill="#2A9D8F"/>
  <text x="586" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172033">100</text>
  <text x="634" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172033">100</text>
  <text x="682" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172033">100</text>

  <!-- autonomous replicated: 100, 0, 100 -->
  <rect x="785" y="140" width="42" height="360" rx="4" fill="#276FBF"/>
  <rect x="833" y="496" width="42" height="4" rx="2" fill="#F28E2B"/>
  <rect x="881" y="140" width="42" height="360" rx="4" fill="#2A9D8F"/>
  <text x="806" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172033">100</text>
  <text x="854" y="487" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172033">0</text>
  <text x="902" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172033">100</text>

  <g font-family="Arial, sans-serif" font-size="14" fill="#24324a" text-anchor="middle">
    <text x="194" y="528"><tspan x="194">Scientific-state</tspan><tspan x="194" dy="18">compaction</tspan></text>
    <text x="414" y="528"><tspan x="414">Structured</tspan><tspan x="414" dy="18">ledger</tspan></text>
    <text x="634" y="528"><tspan x="634">Targeted retrieval</tspan><tspan x="634" dy="18">+ stable locators</tspan></text>
    <text x="854" y="528"><tspan x="854">Autonomous</tspan><tspan x="854" dy="18">campaign</tspan></text>
  </g>

  <rect x="230" y="590" width="18" height="18" rx="3" fill="#276FBF"/>
  <text x="256" y="604" font-family="Arial, sans-serif" font-size="14" fill="#24324a">Winner selected</text>
  <rect x="420" y="590" width="18" height="18" rx="3" fill="#F28E2B"/>
  <text x="446" y="604" font-family="Arial, sans-serif" font-size="14" fill="#24324a">Numerical criterion</text>
  <rect x="630" y="590" width="18" height="18" rx="3" fill="#2A9D8F"/>
  <text x="656" y="604" font-family="Arial, sans-serif" font-size="14" fill="#24324a">Grounded row evidence</text>
  <text x="500" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7688">Exploratory milestone conditions; autonomous numerical scoring used the stricter value-specific tolerance.</text>
</svg>
